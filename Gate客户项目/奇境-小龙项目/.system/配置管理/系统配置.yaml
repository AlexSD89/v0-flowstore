# 奇境-小龙项目系统配置文件
# 基于Gate三层架构的人机交互系统配置

system:
  name: "奇境-小龙AI自动化系统"
  version: "V2.0.0"
  architecture: "Gate三层人机交互架构"
  last_updated: "2025-11-13"
  
# 人机交互配置
human_interaction:
  project_classification:
    enabled: true
    auto_classification: true
    supported_types:
      - "Excel数据分析"
      - "设计审查"  
      - "项目协调"
    
  fine_tuning:
    enabled: true
    auto_generation: true
    template_path: ".tech/核心引擎/13-人机交互架构/特化微调文档生成器.md"
    
  skills_automation:
    enabled: true
    skills_ecosystem: "LaunchX Skills"
    integration_path: ".tech/技能系统/"

# 技术实现层配置
technical_implementation:
  deep_burial:
    enabled: true
    user_visible_layer: ["我的项目", "系统设置", "使用指南", "项目档案"]
    hidden_layers: [".system", ".tech", ".runtime"]
    
  core_engines:
    - name: "数据处理引擎"
      path: ".tech/核心引擎/"
      status: "active"
    - name: "AI推理引擎" 
      path: ".tech/核心引擎/"
      status: "active"
    - name: "技能编排引擎"
      path: ".tech/技能系统/"
      status: "active"
    - name: "质量检查引擎"
      path: ".tech/基础设施/09-质量保障/"
      status: "active"

# 项目管理配置
project_management:
  workflow:
    auto_classification: true
    processing_stages:
      - "新项目"
      - "进行中" 
      - "已完成"
      
  quality_standards:
    excel_analysis:
      completion_rate: "≥95%"
      accuracy: "≥98%"
      processing_time: "≤30分钟"
    design_review:
      visual_quality: "≥90%"
      brand_consistency: "≥95%"
      compliance: "100%"

# 客户接口配置
customer_interface:
  adjustable_parameters:
    enabled: true
    config_path: "系统设置/07-客户接口/可调参数/"
    
  feedback_collection:
    enabled: true
    automation: true
    satisfaction_target: "≥4.5/5.0"

# 系统监控配置
monitoring:
  performance_metrics:
    response_time: "≤2秒"
    processing_accuracy: "≥95%"
    system_stability: "≥99.9%"
    
  health_checks:
    enabled: true
    check_interval: "5分钟"
    alert_threshold: "95%"

# 安全配置
security:
  access_control:
    user_layer_access: "full"
    system_layer_access: "restricted"
    tech_layer_access: "admin_only"
    
  data_protection:
    encryption: "enabled"
    backup_frequency: "daily"
    retention_period: "90天"