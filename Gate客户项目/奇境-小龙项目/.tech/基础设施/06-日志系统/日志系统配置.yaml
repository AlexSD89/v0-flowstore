## 🎯 关键日志记录点

### 特化1：Excel分析器日志记录
```yaml
specialization1_logging:
  key_events:
    - "文件接收": 记录文件路径、大小、上传时间
    - "模式识别": 记录识别结果、置信度、匹配模板
    - "结构解析": 记录解析耗时、发现的特征
    - "业务分析": 记录业务模式、行业匹配结果
    - "内容生成": 记录生成各部分耗时、内容长度
    - "质量评估": 记录各项评分、总体分数
    - "输出生成": 记录输出文件路径、文件大小
    - "异常处理": 记录错误类型、处理方式、结果
  
  performance_metrics:
    - "total_processing_time": 总处理时间
    - "structure_analysis_time": 结构解析时间
    - "content_generation_time": 内容生成时间
    - "quality_check_time": 质量检查时间
    - "file_size": 处理文件大小
    - "rows_processed": 处理数据行数
    - "columns_processed": 处理数据列数
  
  quality_indicators:
    - "completeness_score": 完整度评分
    - "translation_score": 翻译质量评分
    - "brand_consistency_score": 品牌一致性评分
    - "seo_optimization_score": SEO优化评分
    - "overall_quality_score": 综合质量评分
```

