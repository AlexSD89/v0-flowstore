```

## 📝 日志使用指南

### 日志查看命令
```bash
# 查看实时日志
tail -f 06-日志系统/执行日志/特化1执行.log

# 查看错误日志
grep "ERROR" 06-日志系统/错误日志/系统错误.log

# 查看性能日志
grep "PERFORMANCE" 06-日志系统/性能日志/处理时间.log

# 查看特定时间段日志
grep "2025-11-13" 06-日志系统/执行日志/特化1执行.log
```

### 日志分析命令
```bash
# 统计处理次数
grep "文件接收" 06-日志系统/执行日志/特化1执行.log | wc -l

# 统计错误次数
grep "ERROR" 06-日志系统/错误日志/系统错误.log | wc -l

# 分析平均处理时间
grep "处理时间" 06-日志系统/性能日志/处理时间.log | awk '{print $NF}' | sed 's/秒//g' | awk '{sum+=$1} count++} END {print "平均处理时间:", sum/count, "秒"}'
```

