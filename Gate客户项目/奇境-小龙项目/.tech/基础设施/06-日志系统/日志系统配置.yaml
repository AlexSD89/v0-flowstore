# 奇境-小龙项目 - 日志系统配置
**目标**: 完整记录系统运行状态，支持生产监控和问题诊断

## 📊 日志分类和存储

### 执行日志配置
```yaml
execution_logs:
  # 特化1执行日志
  specialization1:
    file_path: "06-日志系统/执行日志/特化1执行.log"
    rotation_size: "10MB"
    retention_days: 30
    log_level: "INFO"
    format: "[%(asctime)s] [%(levelname)s] [%(module)s] - %(message)s"
    
  # 特化2执行日志
  specialization2:
    file_path: "06-日志系统/执行日志/特化2执行.log"
    rotation_size: "10MB"
    retention_days: 30
    log_level: "INFO"
    format: "[%(asctime)s] [%(levelname)s] [%(module)s] - %(message)s"
    
  # 特化3执行日志
  specialization3:
    file_path: "06-日志系统/执行日志/特化3执行.log"
    rotation_size: "20MB"
    retention_days: 60
    log_level: "INFO"
    format: "[%(asctime)s] [%(levelname)s] [%(module)s] - %(message)s"
```

### 错误日志配置
```yaml
error_logs:
  # 系统错误日志
  system_errors:
    file_path: "06-日志系统/错误日志/系统错误.log"
    rotation_size: "5MB"
    retention_days: 90
    log_level: "ERROR"
    format: "[%(asctime)s] [%(levelname)s] [%(module)s:%(lineno)d] [%(funcName)s] - %(message)s"
    
  # 业务错误日志
  business_errors:
    file_path: "06-日志系统/错误日志/业务错误.log"
    rotation_size: "10MB"
    retention_days: 60
    log_level: "ERROR"
    format: "[%(asctime)s] [%(levelname)s] [BUSINESS] - %(message)s"
    
  # 配置错误日志
  configuration_errors:
    file_path: "06-日志系统/错误日志/配置错误.log"
    rotation_size: "5MB"
    retention_days: 90
    log_level: "WARNING"
    format: "[%(asctime)s] [%(levelname)s] [CONFIG] - %(message)s"
```

### 性能日志配置
```yaml
performance_logs:
  # 处理时间日志
  processing_time:
    file_path: "06-日志系统/性能日志/处理时间.log"
    rotation_size: "15MB"
    retention_days: 30
    log_level: "INFO"
    format: "[%(asctime)s] [PERFORMANCE] [%(task_type)s] [%(file_name)s] - 处理时间: %(processing_time)s秒, 状态: %(status)s"
    
  # 资源使用日志
  resource_usage:
    file_path: "06-日志系统/性能日志/资源使用.log"
    rotation_size: "10MB"
    retention_days: 30
    log_level: "INFO"
    format: "[%(asctime)s] [PERFORMANCE] [%(resource_type)s] - CPU: %(cpu_usage)s%%, 内存: %(memory_usage)sMB, 磁盘: %(disk_usage)sMB"
    
  # 质量指标日志
  quality_metrics:
    file_path: "06-日志系统/性能日志/质量指标.log"
    rotation_size: "10MB"
    retention_days: 60
    log_level: "INFO"
    format: "[%(asctime)s] [QUALITY] [%(task_type)s] - 综合评分: %(overall_score)s, 完整度: %(completeness)s, 翻译质量: %(translation_quality)s"
```

### 学习日志配置
