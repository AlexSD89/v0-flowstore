    brand_introduction:
      focus: "公司实力和行业地位"
      key_points:
        - "成立年限和规模"
        - "行业经验和专长"
        - "技术优势"
        - "质量承诺"
      tone: "专业稳重"
      length: "150-250字"
    
    product_highlights:
      focus: "产品技术优势"
      key_points:
        - "核心技术参数"
        - "质量标准"
        - "创新特点"
        - "应用场景"
      tone: "技术专业"
      length: "200-350字"
    
    service_network:
      focus: "全球服务能力"
      key_points:
        - "生产基地分布"
        - "销售网络覆盖"
        - "售后服务承诺"
        - "本地化支持"
      tone: "可靠保障"
      length: "100-200字"
    
    quality_assurance:
      focus: "质量管理体系"
      key_points:
        - "质量认证体系"
        - "检测标准"
        - "质量控制流程"
        - "持续改进机制"
      tone: "严谨专业"
      length: "150-250字"
  
  quality_standards:
    completeness_threshold: 90
    translation_threshold: 95
    brand_consistency: 100
    seo_optimization: 80
    
