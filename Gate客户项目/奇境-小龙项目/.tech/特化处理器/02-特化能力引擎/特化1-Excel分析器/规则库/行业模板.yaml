## 🔧 模板匹配规则

### 自动识别规则
```yaml
auto_recognition_rules:
  industry_keywords:
    manufacturing:
      - "生产"
      - "制造"
      - "工厂"
      - "设备"
      - "ISO"
      - "质量标准"
    
    service:
      - "服务"
      - "咨询"
      - "解决方案"
      - "专业服务"
      - "客户服务"
    
    technology:
      - "技术"
      "软件"
      - "平台"
      "系统"
      "创新"
      "研发"
    
    retail:
      - "零售"
      - "商城"
      - "店铺"
      - "产品销售"
      - "消费者"
    
    education:
      - "培训"
      - "教育"
      - "学习"
      - "课程"
      - "教学"
  
  business_model_indicators:
    b2b_focus:
      - "企业客户"
      - "B2B"
      - "商业客户"
      - "企业服务"
    
    b2c_focus:
      - "消费者"
      - "B2C"
      - "个人用户"
      - "终端客户"
  
  market_scope_indicators:
    domestic_market:
      - "国内市场"
      - "本土服务"
      - "中国客户"
    
    international_market:
      - "海外市场"
      - "国际业务"
      - "全球服务"
      - "外贸"
```

### 模板选择优先级
```yaml
template_selection_priority:
  # 匹配得分计算
  industry_match_weight: 0.50      # 行业匹配权重
  business_model_weight: 0.30     # 商业模式权重
  market_scope_weight: 0.20       # 市场范围权重
  
  # 最低匹配阈值
  minimum_match_score: 0.70        # 最低匹配分数
  
  # 自动选择规则
  auto_selection_enabled: true     # 启用自动选择
  manual_override_allowed: true    # 允许手动覆盖
```

