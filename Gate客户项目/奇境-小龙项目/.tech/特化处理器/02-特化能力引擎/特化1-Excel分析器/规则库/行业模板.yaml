    technical_specs:
      - "主要设备"
      - "生产能力"
      - "质量标准"
      - "技术专利"
    
    certifications:
      - "ISO认证"
      - "行业认证"
      - "质量体系"
    
    contact_information:
      - "联系人"
      - "联系电话"
      - "公司地址"
      - "邮箱地址"
      - "官方网站"
  
