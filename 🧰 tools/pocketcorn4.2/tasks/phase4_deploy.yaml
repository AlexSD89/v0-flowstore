phase: phase4_deploy
summary: >-
  完成部署、监控、配置管理，确保系统在生产环境稳定运行并具备可观测性。
tasks:
  - id: T401
    name: 环境依赖清单
    description: >-
      梳理并编写部署依赖（Python 包、系统库、模型文件、浏览器驱动、代理服务），更新 requirements & Dockerfile。
    commands:
      - python tools/deploy/generate_dependency_matrix.py
      - pytest tools/tests/test_dependency_matrix.py
    outputs:
      - requirements.txt
      - docker/Dockerfile
    tags: [deploy]

  - id: T402
    name: 配置与密钥管理
    description: >-
      集成 LaunchX 配置中心（或 dotenv 管理），安全存储 MindSpider/MCP/数据库凭据。
    depends_on: [T401]
    commands:
      - python tools/deploy/setup_config_store.py
    outputs:
      - config/README.md
      - config/.env.example
    tags: [deploy, security]

  - id: T403
    name: 监控与告警
    description: >-
      接入 Prometheus/Grafana 或第三方监控，采集 mission 成功率、采集耗时、模型推理耗时、报告生成耗时等指标。
    depends_on: [T402]
    commands:
      - python tools/deploy/setup_observability.py
      - python tools/deploy/verify_metrics.py
    outputs:
      - config/observability.yaml
    tags: [observability]

  - id: T404
    name: CI/CD 管线
    description: >-
      为任务脚本、测试、部署创建 CI/CD 流程（GitHub Actions 或 GitLab CI），支持自动测试与部署。
    depends_on: [T403]
    commands:
      - python tools/deploy/generate_ci_pipeline.py
    outputs:
      - .github/workflows/pocketcorn.yml
    tags: [cicd]

  - id: T405
    name: 生产演练与验收
    description: >-
      在生产环境执行一次完整任务，验证监控、日志、告警、报告链路，形成验收文档。
    depends_on: [T404]
    commands:
      - python tools/run_full_mission.py --description "生产演练" --output reports/production_acceptance.md
      - python tools/deploy/collect_metrics_snapshot.py --output reports/production_metrics.json
    outputs:
      - reports/production_acceptance.md
      - reports/production_metrics.json
    tags: [deploy, acceptance]
