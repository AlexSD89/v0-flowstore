phase: phase2_analysis
summary: >-
  构建多维信号分析管线，复用 Weibo 情感模型与 InsightEngine 主题算法，
  并扩展增长、风险、文化匹配度等业务维度。
tasks:
  - id: T201
    name: 抽象情感分析服务
    description: >-
      将 SentimentAnalysisModel 中选定的模型（默认 Multilingual）封装成 SentimentAnalyzer，
      支持批量推理与热加载。
    commands:
      - python tools/importers/import_sentiment_model.py --model multilingual
      - pytest tests/services/test_sentiment_analyzer.py
    outputs:
      - src/pocketcorn/services/analysis/sentiment_analyzer.py
      - models/sentiment/multilingual/
    tags: [analysis, sentiment]

  - id: T202
    name: 主题与关键词分析
    description: >-
      复用 InsightEngine/ForumEngine 的关键词抽取与主题聚类，封装为 TopicAnalyzer。
    depends_on: [T201]
    commands:
      - python tools/importers/import_topic_analyzer.py
      - pytest tests/services/test_topic_analyzer.py
    outputs:
      - src/pocketcorn/services/analysis/topic_analyzer.py
    tags: [analysis, topic]

  - id: T203
    name: 风险与文化匹配识别
    description: >-
      基于情感、关键词及业务规则，生成风险标签与文化匹配度评分。
    depends_on: [T201, T202]
    commands:
      - python tools/task_helpers/build_risk_rules.py
      - pytest tests/services/test_risk_profiler.py
    outputs:
      - src/pocketcorn/services/analysis/risk_profiler.py
      - src/pocketcorn/services/analysis/culture_profiler.py
    tags: [analysis, risk, culture]

  - id: T204
    name: 串联 SignalProcessor
    description: >-
      更新 SignalProcessor，将情感、主题、风险、文化等分析器串联执行，输出统一结构。
    depends_on: [T201, T202, T203]
    commands:
      - python tools/task_helpers/update_signal_processor.py
      - pytest tests/unit/test_signal_processor.py
    outputs:
      - src/pocketcorn/services/collectors/signal_processor.py
    tags: [signal-processing]

  - id: T205
    name: 分析指标持久化
    description: >-
      修改 MissionRepository/PersistenceLayer，保存分析指标、风险标签及文化信息。
    depends_on: [T204]
    commands:
      - python tools/task_helpers/update_persistence_schema.py
      - pytest tests/unit/test_mission_repository.py
    outputs:
      - src/pocketcorn/mission_tracking/persistence.py
    tags: [persistence, analysis]

  - id: T206
    name: 分析效果验证
    description: >-
      运行真实 mission，对比情感/主题结果与人工标注，生成校验报告。
    depends_on: [T205]
    commands:
      - python tools/run_mission.py --name "Analysis Smoke Test" --description "验证分析模块" --geography CN --revenue-threshold 50000 --output reports/staging_phase2.json
      - python tools/export_analysis_validation.py --input reports/staging_phase2.json --output reports/staging_phase2.md
    outputs:
      - reports/staging_phase2.md
    tags: [integration, analysis]
