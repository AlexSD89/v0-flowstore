# V1设计哲学融合配置文件
# 整合V1三大设计哲学与V4.1系统，实现证据驱动的智能决策

# 基础配置
metadata:
  version: "1.0.0"
  created_at: "2025-11-18"
  description: "V1设计哲学与V4.1系统融合配置"
  compatibility: "v4.1+"

# V1设计哲学权重配置
philosophy_weights:
  # 数据驱动内容自动化 (40%)
  data_driven:
    weight: 0.4
    priority: 1
    enabled: true
    description: "基于四大数据维度的智能内容生产闭环"

  # 多Agent协作论坛机制 (35%)
  forum_collaboration:
    weight: 0.35
    priority: 2
    enabled: true
    description: "AI主持人引导的7个专业化Agent协作机制"

  # 动态规格迭代计划 (25%)
  dynamic_iteration:
    weight: 0.25
    priority: 3
    enabled: true
    description: "PRD→模板→执行→复盘的闭环迭代系统"

# V3证据驱动哲学集成
evidence_driven_philosophy:
  enabled: true
  integration_level: "deep"

  # 证据账本配置
  evidence_ledger:
    enabled: true
    max_evidence_age_days: 90
    confidence_threshold: 0.5
    triangulation_required: true

  # 自主等级系统
  autonomy_levels:
    LOA0_ADVICE:
      max_impact_score: 0.2
      max_risk_score: 0.3

    LOA1_ALTERNATIVES:
      max_impact_score: 0.4
      max_risk_score: 0.5

    LOA2_LOW_RISK_AUTO:
      max_impact_score: 0.6
      max_risk_score: 0.7
      rollback_required: true

    LOA3_GUARDRAIL_AUTO:
      max_impact_score: 0.8
      max_risk_score: 0.9
      monitoring_required: true

    LOA4_HUMAN_ONLY:
      description: "高影响高风险决策，必须人工审核"

# 数据驱动引擎配置
data_driven_engine:
  enabled: true

  # 四大数据维度
  data_dimensions:
    ai_tools_market:
      enabled: true
      weight: 0.25
      sources:
        - github_trending
        - product_hunt
        - tech_news
        - funding_data
      collection_frequency: "daily"

    user_behavior:
      enabled: true
      weight: 0.30
      sources:
        - xiaohongshu_trends
        - user_interactions
        - engagement_metrics
        - content_preferences
      collection_frequency: "real_time"

    competitor_monitoring:
      enabled: true
      weight: 0.25
      sources:
        - competitor_content
        - market_positioning
        - strategy_changes
        - performance_metrics
      collection_frequency: "daily"

    industry_trends:
      enabled: true
      weight: 0.20
      sources:
        - industry_news
        - technology_trends
        - investment_hotspots
        - regulatory_changes
      collection_frequency: "weekly"

  # 智能分析配置
  intelligent_analysis:
    enabled: true
    algorithms:
      - trend_detection
      - sentiment_analysis
      - engagement_prediction
      - content_optimization

    model_thresholds:
      confidence_min: 0.7
      prediction_accuracy_min: 0.8
      trend_strength_min: 0.6

# 论坛协作引擎配置
forum_collaboration_engine:
  enabled: true

  # 7个专业化Agent配置
  agents:
    market_analyst:
      role: "市场分析师"
      expertise: ["市场趋势", "竞品分析", "用户洞察"]
      weight: 0.15

    content_strategist:
      role: "内容策略师"
      expertise: ["内容策划", "创意发想", "平台规则"]
      weight: 0.15

    data_scientist:
      role: "数据科学家"
      expertise: ["数据分析", "统计建模", "A/B测试"]
      weight: 0.15

    creative_director:
      role: "创意总监"
      expertise: ["创意评估", "品牌调性", "视觉审美"]
      weight: 0.15

    community_manager:
      role: "社区经理"
      expertise: ["用户互动", "社群运营", "危机管理"]
      weight: 0.10

    technical_expert:
      role: "技术专家"
      expertise: ["工具使用", "平台技术", "自动化"]
      weight: 0.15

    business_strategist:
      role: "商业策略师"
      expertise: ["商业模式", "ROI分析", "增长策略"]
      weight: 0.15

  # AI主持人配置
  intelligent_host:
    enabled: true
    trigger_frequency: 5  # 每5条Agent发言触发一次
    discussion_timeout_minutes: 15  # 15分钟无活动自动结束
    consensus_threshold: 0.7  # 共识形成阈值

  # 论坛协作流程
  collaboration_workflow:
    phases:
      - name: "问题定义"
        duration_minutes: 5
        participants: ["intelligent_host"]

      - name: "Agent研讨"
        duration_minutes: 20
        participants: ["all_agents"]

      - name: "共识形成"
        duration_minutes: 10
        participants: ["intelligent_host"]

      - name: "方案输出"
        duration_minutes: 5
        participants: ["intelligent_host"]

# 动态迭代引擎配置
dynamic_iteration_engine:
  enabled: true

  # PRD处理配置
  spec_processing:
    enabled: true
    template_engine: "jinja2"
    auto_extraction: true

  # 模板引擎配置
  template_engine:
    enabled: true
    template_types:
      - content_template
      - analysis_template
      - report_template
      - strategy_template

  # 执行监控配置
  execution_monitoring:
    enabled: true
    real_time_tracking: true
    checkpoint_frequency: "hourly"
    alert_thresholds:
      success_rate_min: 0.8
      completion_time_max_hours: 24
      error_rate_max: 0.1

  # 迭代分析配置
  iteration_analysis:
    enabled: true
    analysis_frequency: "daily"
    improvement_detection: true
    auto_optimization: true

# V4.1兼容性配置
v41_compatibility:
  # 保持V4.1性能优化
  preserve_performance_optimizations: true

  # 保持缓存策略
  maintain_cache_strategies: true

  # 保持异步架构
  keep_async_architecture: true

  # 性能影响限制
  performance_impact_limits:
    response_time_increase_max_percent: 5  # 最大5%响应时间增长
    throughput_decrease_max_percent: 3     # 最大3%吞吐量下降
    memory_usage_increase_max_percent: 10   # 最大10%内存使用增长

  # 资源使用限制
  resource_limits:
    max_cpu_usage_percent: 80
    max_memory_usage_mb: 2048
    max_concurrent_workflows: 100

# 监控和告警配置
monitoring:
  enabled: true

  # V1哲学融合监控
  philosophy_integration_metrics:
    data_driven_success_rate_min: 0.9
    forum_collaboration_efficiency_min: 0.85
    iteration_improvement_rate_min: 0.8

  # 系统性能监控
  performance_metrics:
    api_response_time_p50_max_ms: 100
    api_response_time_p95_max_ms: 200
    system_availability_min: 0.999

  # 业务指标监控
  business_metrics:
    content_automation_rate_min: 0.95
    decision_quality_score_min: 0.8
    user_satisfaction_min: 0.85

# 质量保障配置
quality_assurance:
  enabled: true

  # 测试覆盖要求
  testing_requirements:
    unit_test_coverage_min: 0.9
    integration_test_coverage_min: 0.85
    end_to_end_test_coverage_min: 0.8

  # 代码质量标准
  code_quality:
    type_annotation_coverage_min: 0.95
    documentation_coverage_min: 0.9
    code_review_required: true

  # 安全要求
  security:
    vulnerability_scan_required: true
    data_encryption_enabled: true
    access_control_enforced: true

# 部署配置
deployment:
  environment: "development"

  # 灰度发布策略
  rollout_strategy:
    phases:
      - percentage: 10
        duration_hours: 6
        monitoring_enabled: true

      - percentage: 30
        duration_hours: 12
        monitoring_enabled: true

      - percentage: 60
        duration_hours: 24
        monitoring_enabled: true

      - percentage: 100
        duration_hours: 48
        monitoring_enabled: true

    rollback_conditions:
      error_rate_threshold: 0.05
      response_time_increase_threshold: 0.1
      user_complaint_threshold: 3

# 配置验证规则
validation_rules:
  # 权重总和检查
  weight_sum_validation:
    tolerance: 0.01
    error_message: "哲学权重总和必须等于1.0"

  # 必需字段检查
  required_fields:
    - philosophy_weights
    - v41_compatibility
    - monitoring

  # 数值范围检查
  value_ranges:
    philosophy_weights:
      min: 0.0
      max: 1.0
    confidence_thresholds:
      min: 0.0
      max: 1.0