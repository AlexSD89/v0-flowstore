# Gate MCP工作流配置

workflows:
  brand_promotion:
    name: "品牌宣传工作流"
    description: "小红书品牌宣传全流程自动化"
    version: "1.0.0"
    
    # 工作流阶段定义
    phases:
      - name: "content_strategy"
        description: "内容策略制定"
        agents: ["strategy_agent", "content_agent"]
        tools: ["gate_search", "gemini_text"]
        timeout: 300
        
      - name: "content_creation"
        description: "多模态内容创作"
        agents: ["content_agent"]
        tools: ["gemini_image", "gemini_video", "xiaohongshu_mcp"]
        timeout: 600
        
      - name: "content_publishing"
        description: "内容发布和分发"
        agents: ["content_agent", "interaction_agent"]
        tools: ["xiaohongshu_mcp", "instagram", "twitter"]
        timeout: 300
        
      - name: "user_interaction"
        description: "用户互动和社群运营"
        agents: ["interaction_agent"]
        tools: ["browser_automation", "xiaohongshu_mcp"]
        timeout: 1800
        
      - name: "performance_analysis"
        description: "效果分析和优化"
        agents: ["analytics_agent"]
        tools: ["hubspot_crm", "analytics"]
        timeout: 600
        
      - name: "strategy_optimization"
        description: "策略优化和建议"
        agents: ["strategy_agent", "analytics_agent"]
        tools: ["gate_search", "analytics"]
        timeout: 300

# 智能代理配置
agents:
  strategy_agent:
    name: "策略分析代理"
    description: "负责市场分析、策略制定和优化建议"
    capabilities:
      - "市场趋势分析"
      - "竞品分析"
      - "目标受众分析"
      - "内容策略制定"
      - "效果预测"
    llm_model: "claude-3-sonnet"
    temperature: 0.3
    max_tokens: 3000

  content_agent:
    name: "内容创作代理"
    description: "负责多模态内容创作和优化"
    capabilities:
      - "文案创作"
      - "图像生成"
      - "视频制作"
      - "内容风格控制"
      - "质量评估"
    llm_model: "gemini-1.5-pro"
    temperature: 0.8
    max_tokens: 2048

  interaction_agent:
    name: "用户互动代理"
    description: "负责用户互动、社群运营和客户服务"
    capabilities:
      - "自动化回复"
      - "情感分析"
      - "用户画像分析"
      - "个性化服务"
      - "社群管理"
    llm_model: "claude-3-sonnet"
    temperature: 0.6
    max_tokens: 1500

  analytics_agent:
    name: "数据分析代理"
    description: "负责数据分析、效果评估和优化建议"
    capabilities:
      - "效果数据分析"
      - "用户行为分析"
      - "ROI计算"
      - "预测分析"
      - "报告生成"
    llm_model: "claude-3-sonnet"
    temperature: 0.2
    max_tokens: 2500

# 工具集成配置
tools:
  gate_search:
    name: "Gate搜索工具"
    description: "基于Gate的智能搜索和市场分析"
    endpoint: "/tools/search"
    timeout: 30
    max_retries: 3
    
  gemini_text:
    name: "Gemini文本生成"
    description: "Gemini AI文本生成能力"
    endpoint: "/tools/gemini/text"
    timeout: 60
    max_tokens: 2048
    
  gemini_image:
    name: "Gemini图像生成"
    description: "Gemini AI图像生成能力"
    endpoint: "/tools/gemini/image"
    timeout: 120
    max_size: 1080
    
  gemini_video:
    name: "Gemini视频生成"
    description: "Gemini AI视频生成能力"
    endpoint: "/tools/gemini/video"
    timeout: 300
    max_duration: 60

# 决策规则配置
decision_rules:
  content_quality_threshold: 0.8
  engagement_rate_minimum: 0.05
  sentiment_score_threshold: 0.7
  response_time_limit: 300
  
  # 自动化决策条件
  auto_publish:
    enabled: true
    quality_check: true
    compliance_check: true
    
  auto_reply:
    enabled: true
    sentiment_check: true
    spam_filter: true
    
  auto_optimize:
    enabled: true
    performance_threshold: 0.1
    optimization_frequency: "daily"

# 错误处理和重试配置
error_handling:
  max_retries: 3
  retry_delay: 5
  exponential_backoff: true
  
  # 错误分类和处理策略
  error_types:
    network_error:
      action: "retry"
      max_retries: 5
      
    api_limit_error:
      action: "wait_and_retry"
      wait_time: 300
      
    authentication_error:
      action: "fail_and_notify"
      
    content_quality_error:
      action: "regenerate"
      max_attempts: 3
      
    platform_error:
      action: "skip_and_log"

# 监控和日志配置
monitoring:
  enabled: true
  log_level: "INFO"
  metrics_interval: 60
  
  # 关键指标监控
  key_metrics:
    - "workflow_success_rate"
    - "agent_performance"
    - "tool_response_time"
    - "content_quality_score"
    - "user_engagement_rate"

# V4.1性能优化配置
performance:
  # API响应时间目标 (ms)
  response_time_targets:
    p50: 100
    p95: 200
    current_p50: 85
    current_p95: 175

  # 并发用户数目标
  concurrency_targets:
    target: 1000
    current: 1200
    max_connections: 15

  # 系统可用性目标
  availability_targets:
    target: 99.9
    current: 99.95

  # 数据处理吞吐量目标 (MB/s)
  throughput_targets:
    target: 10
    current: 12
    target_optimized: 15

  # 成本优化目标
  cost_optimization:
    target_reduction: 20
    current_cost: 200
    target_cost: 160
    roi_target: 5.1

# 资源管理配置
resource_management:
  max_concurrent_workflows: 10
  max_concurrent_agents: 20
  memory_limit: "4GB"
  cpu_limit: "2 cores"

  # 资源分配策略
  agent_resources:
    strategy_agent:
      memory: "1GB"
      cpu: "0.5 cores"

    content_agent:
      memory: "2GB"
      cpu: "1.0 cores"

    interaction_agent:
      memory: "512MB"
      cpu: "0.3 cores"

    analytics_agent:
      memory: "1GB"
      cpu: "0.5 cores"

# V4.1 缓存策略优化
cache:
  # L1内存缓存配置
  l1_cache:
    enabled: true
    max_size: 1000
    ttl: 300

  # L2 Redis缓存配置
  l2_cache:
    enabled: true
    redis_available: true
    redis_host: "localhost"
    redis_port: 6379
    max_connections: 10

  # 缓存策略
  strategies:
    # 工作流配置缓存
    workflow_config:
      ttl: 600
      warm_up: true

    # 代理结果缓存
    agent_results:
      ttl: 300
      warm_up: false

    # API响应缓存
    api_responses:
      ttl: 180
      warm_up: false

    # 趋势数据缓存
    trend_data:
      ttl: 3600
      warm_up: true

# 连接池优化配置
connection_pool:
  # Gate MCP连接池
  gate_mcp:
    max_connections: 10
    connection_timeout: 30
    read_timeout: 60
    max_retries: 3
    retry_delay: 1

  # 外部API连接池
  external_apis:
    gemini:
      max_connections: 5
      rate_limit: 100
      burst: 20

    xiaohongshu:
      max_connections: 3
      rate_limit: 50
      burst: 10

# 性能监控配置
monitoring:
  enabled: true
  log_level: "INFO"
  metrics_interval: 60

  # 性能指标监控
  performance_metrics:
    response_times:
      enabled: true
      window_size: 1000
      alert_threshold_p95: 250

    workflow_durations:
      enabled: true
      window_size: 500
      alert_threshold_avg: 300

    error_rates:
      enabled: true
      window_size: 100
      alert_threshold: 5.0

    cache_hit_rates:
      enabled: true
      alert_threshold_min: 80.0

    concurrent_workflows:
      enabled: true
      alert_threshold_max: 15

  # 成本监控
  cost_monitoring:
    enabled: true
    target_monthly_cost: 160
    current_monthly_cost: 200
    alert_threshold: 180

# V1设计哲学集成配置
v1_philosophy:
  # 设计哲学权重配置
  weights:
    data_driven: 0.4        # 数据驱动内容自动化权重40%
    forum_collaboration: 0.35  # 多Agent协作论坛机制权重35%
    dynamic_iteration: 0.25    # 动态规格迭代计划权重25%

  # 数据驱动配置
  data_driven:
    collection_schedule:
      daily_collection: "02:00-06:00"  # 每日数据收集时间
      analysis_engine: "06:00-08:00"    # 智能数据分析时间
      content_production: "08:00-10:00" # 自动内容生产时间
      precision_delivery: "10:00-12:00" # 精准投放时间

    data_dimensions:
      - "AI工具市场数据"  # GitHub新项目、ProductHunt趋势、融资动态
      - "用户行为数据"    # 小红书趋势、需求痛点、互动偏好
      - "竞争对手监控"    # 竞品内容、市场定位、策略变化
      - "行业趋势分析"    # 新闻热点、技术趋势、投资热点

  # 论坛协作配置
  forum_collaboration:
    agent_speech_threshold: 5      # 每5条Agent发言触发主持人
    search_inactive_threshold: 900 # 15分钟无活动结束论坛

    agents:
      INSIGHT: "私有舆情数据库深度挖掘"
      MEDIA: "多模态内容分析"
      QUERY: "精准信息搜索"
      TECHNICAL: "技术指标评测"
      BUSINESS: "商业价值评估"
      USER: "用户体验评测"
      SECURITY: "安全合规评测"

    host_model: "claude-4.0-sonnet"  # AI主持人模型

  # 动态迭代配置
  dynamic_iteration:
    closed_loop_stages:
      - "PRD更新处理"
      - "模板刷新"
      - "执行监控"
      - "反馈分析"
      - "自动迭代报告"

    iteration_components:
      spec_processor: "PRD处理器"
      template_engine: "模板引擎"
      execution_monitor: "执行监控器"
      feedback_analyzer: "反馈分析器"
      iteration_reporter: "自动迭代报告器"

    auto_improvement:
      enabled: true
      suggestion_threshold: 0.8  # 建议采纳阈值
      iteration_frequency: "weekly"  # 迭代频率

# 缓存策略
caching:
  enabled: true
  cache_duration: 3600
  
  # 缓存类型
  cache_types:
    search_results: 1800
    generated_content: 7200
    user_profiles: 14400
    analytics_data: 300