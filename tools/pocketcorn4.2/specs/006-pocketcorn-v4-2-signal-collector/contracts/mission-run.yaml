openapi: 3.0.0
info:
  title: Pocketcorn Mission Run Contract
  version: 0.1.0
  description: >-
    Contract describing the request/response envelope for triggering a universal
    signal collector mission and receiving normalized results.
paths:
  /missions/{mission_id}/run:
    post:
      summary: Trigger a mission run (on-demand or scheduled)
      parameters:
        - name: mission_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [on-demand, scheduled]
                override_criteria:
                  type: object
                  description: Optional temporary adjustments to mission criteria.
                requested_by:
                  type: string
                  description: Analyst identifier initiating the run.
              required: [mode, requested_by]
      responses:
        '202':
          description: Mission accepted; processing asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    format: uuid
                  mission_id:
                    type: string
                    format: uuid
                  accepted_at:
                    type: string
                    format: date-time
                  estimated_completion:
                    type: string
                    format: date-time
        '400':
          description: Invalid mission state or missing criteria.
        '429':
          description: Platform rate limit reached; mission paused.
  /missions/runs/{run_id}:
    get:
      summary: Retrieve MissionRunSummary for a completed run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mission results ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                  run_timestamp:
                    type: string
                    format: date-time
                  companies_detected:
                    type: array
                    items:
                      type: object
                      properties:
                        company_identifier:
                          type: string
                        overall_score:
                          type: number
                        signal_highlights:
                          type: array
                          items:
                            type: object
                            properties:
                              signal_category:
                                type: string
                              summary:
                                type: string
                              freshness_score:
                                type: number
                              reliability_score:
                                type: number
                              source_link:
                                type: string
                        recommendations:
                          type: array
                          items:
                            type: string
                  coverage_stats:
                    type: object
                    properties:
                      platforms_scanned:
                        type: array
                        items:
                          type: string
                      latency_seconds:
                        type: integer
                      gaps:
                        type: array
                        items:
                          type: string
                  audit_trail:
                    type: array
                    items:
                      type: object
                      properties:
                        event_type:
                          type: string
                        details:
                          type: string
                        recorded_at:
                          type: string
                          format: date-time
        '404':
          description: Run not found or not completed.
