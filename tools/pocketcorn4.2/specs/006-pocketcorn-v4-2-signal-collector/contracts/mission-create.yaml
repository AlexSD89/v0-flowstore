description: Contract for creating a discovery mission in Pocketcorn v4.2.
request:
  format: json
  body:
    type: object
    required:
      - name
      - criteria
      - schedule
    properties:
      name:
        type: string
      criteria:
        type: object
        properties:
          industry:
            type: string
          geography:
            type: array
            items:
              type: string
          revenue_threshold:
            type: integer
          growth_signals:
            type: array
            items:
              type: string
          cultural_focus:
            type: string
        required: [industry, geography, revenue_threshold]
      schedule:
        type: object
        properties:
          cadence:
            type: string
            enum: [daily, weekly, custom]
          time_window:
            type: string
        required: [cadence]
      priority:
        type: string
        enum: [standard, high, audit]
      notification_channel:
        type: string
response:
  success:
    status: 201
    body:
      mission_id: uuid
      coverage_platforms:
        type: array
        items:
          type: string
      next_run_at: timestamp
      validation_messages:
        type: array
        items:
          type: string
  failure:
    status: 422
    body:
      errors:
        type: array
        items:
          type: string
