# Pocketcorn Investment Scoring Framework
# Version: v1.0.0
# Last Updated: 2025-09-11

# Base Currency and Regional Thresholds
currency:
  base: "RMB"
  fx_smoothing_days: 7
  fx_fallback_rate: 7.2  # USD to RMB fallback if API unavailable

regional_thresholds:
  mainland_cn:
    mrr_minimum: 150000  # RMB/month
    confidence_multiplier: 1.0
  hk_mo_tw:
    mrr_minimum: 170000  # RMB/month  
    confidence_multiplier: 1.1
  global:
    mrr_minimum: 180000  # RMB/month
    confidence_multiplier: 1.2

# Core Scoring Weights (Default Configuration)
scoring_weights:
  thesis_fit: 0.30
  traction: 0.40
  cultural_fit: 0.20
  risk: -0.10  # Negative weight (risk penalty)

# Traction Sub-Components (within 0.40 weight)
traction_components:
  hiring_velocity: 0.25      # 0.25 * 0.40 = 0.10 of total
  product_iteration: 0.20    # 0.20 * 0.40 = 0.08 of total
  customer_testimonials: 0.15 # 0.15 * 0.40 = 0.06 of total
  pricing_evolution: 0.15    # 0.15 * 0.40 = 0.06 of total
  infrastructure_scaling: 0.10 # 0.10 * 0.40 = 0.04 of total
  media_presence: 0.10       # 0.10 * 0.40 = 0.04 of total
  operational_expansion: 0.05 # 0.05 * 0.40 = 0.02 of total

# Cultural Fit Sub-Components (within 0.20 weight)
cultural_fit_components:
  communication_style: 0.30    # 0.30 * 0.20 = 0.06 of total
  relationship_oriented: 0.25  # 0.25 * 0.20 = 0.05 of total
  cross_border_readiness: 0.25 # 0.25 * 0.20 = 0.05 of total
  collaborative_governance: 0.20 # 0.20 * 0.20 = 0.04 of total

# Risk Factors (Penalty Components)
risk_components:
  commodity_penalty: 0.50      # 0.50 * 0.10 = 0.05 penalty of total
  transparency_penalty: 0.30   # 0.30 * 0.10 = 0.03 penalty of total  
  sustainability_penalty: 0.20 # 0.20 * 0.10 = 0.02 penalty of total

# Vertical-Specific Weight Presets
vertical_presets:
  b2b_saas:
    thesis_fit: 0.25
    traction: 0.45
    cultural_fit: 0.20
    risk: -0.10
    traction_emphasis:
      hiring_velocity: 0.30
      customer_testimonials: 0.25
      pricing_evolution: 0.20
      product_iteration: 0.15
      infrastructure_scaling: 0.05
      media_presence: 0.03
      operational_expansion: 0.02

  ai_infra:
    thesis_fit: 0.35
    traction: 0.40
    cultural_fit: 0.15
    risk: -0.10
    traction_emphasis:
      infrastructure_scaling: 0.30
      product_iteration: 0.25
      hiring_velocity: 0.20
      media_presence: 0.10
      customer_testimonials: 0.08
      pricing_evolution: 0.05
      operational_expansion: 0.02

  devtools:
    thesis_fit: 0.30
    traction: 0.40
    cultural_fit: 0.15
    risk: -0.15
    traction_emphasis:
      product_iteration: 0.35
      infrastructure_scaling: 0.20
      hiring_velocity: 0.20
      customer_testimonials: 0.15
      media_presence: 0.05
      pricing_evolution: 0.03
      operational_expansion: 0.02

  consumer_ai:
    thesis_fit: 0.20
    traction: 0.50
    cultural_fit: 0.25
    risk: -0.05
    traction_emphasis:
      media_presence: 0.25
      customer_testimonials: 0.25
      product_iteration: 0.20
      hiring_velocity: 0.15
      operational_expansion: 0.10
      pricing_evolution: 0.03
      infrastructure_scaling: 0.02

# Alert Tier Classification
alert_tiers:
  tier_a:
    confidence_threshold: 0.90
    min_sources: 3
    min_total_score: 0.75
    max_alerts_per_day: 2
    cooldown_hours: 24

  tier_b:
    confidence_threshold: 0.80
    min_sources: 2
    min_total_score: 0.65
    max_alerts_per_day: 5
    cooldown_hours: 12

  tier_c:
    confidence_threshold: 0.60
    min_sources: 1
    min_total_score: 0.50
    max_alerts_per_day: 10
    cooldown_hours: 6

# Deduplication and Grouping
deduplication:
  time_window_minutes: 60
  company_cooldown_hours: 24
  batch_grouping_enabled: true
  max_batch_size: 5

# Commodity/Low-Value Penalties
commodity_keywords:
  ai_wrappers:
    keywords: ["ai ppt", "chat wrapper", "pdf chat", "ai写作", "智能客服"]
    penalty: 0.50
    confidence_cap: 0.60

  oversaturated_markets:
    keywords: ["ai写真", "ai换脸", "ai生图", "chatbot", "ai翻译"]
    penalty: 0.30
    confidence_cap: 0.70

  low_barrier_entry:
    keywords: ["模板生成", "批量处理", "简单转换", "基础工具"]
    penalty: 0.20
    confidence_cap: 0.80

# Platform-Specific Signal Weights
platform_weights:
  # Chinese Platforms
  zhihu:
    hiring_velocity: 0.25
    product_iteration: 0.20
    customer_testimonials: 0.15
    media_presence: 0.25
    base_credibility: 0.85

  xiaohongshu:
    customer_testimonials: 0.30
    media_presence: 0.30
    operational_expansion: 0.20
    cultural_indicators: 0.20
    base_credibility: 0.75

  v2ex:
    product_iteration: 0.35
    hiring_velocity: 0.25
    infrastructure_scaling: 0.25
    base_credibility: 0.90

  boss_zhipin:
    hiring_velocity: 0.80
    operational_expansion: 0.20
    base_credibility: 0.95

  # International Platforms
  linkedin:
    hiring_velocity: 0.30
    media_presence: 0.25
    operational_expansion: 0.25
    customer_testimonials: 0.20
    base_credibility: 0.90

  github:
    product_iteration: 0.50
    infrastructure_scaling: 0.30
    hiring_velocity: 0.20
    base_credibility: 0.95

  producthunt:
    customer_testimonials: 0.40
    media_presence: 0.30
    product_iteration: 0.30
    base_credibility: 0.80

  twitter:
    media_presence: 0.40
    customer_testimonials: 0.25
    operational_expansion: 0.20
    cultural_indicators: 0.15
    base_credibility: 0.70

# MRR Inference Algorithm Parameters
mrr_inference:
  hiring_velocity_coefficient: 15000  # RMB per new hire per month
  pricing_tier_multipliers:
    freemium: 0.1
    basic: 1.0
    pro: 2.5
    enterprise: 8.0
  
  customer_volume_estimators:
    testimonial_count_multiplier: 50   # Average RMB per testimonial
    social_engagement_multiplier: 0.1  # RMB per engagement metric
    infrastructure_cost_multiplier: 3.0 # 3x infrastructure costs = revenue

  confidence_adjusters:
    single_source: 0.60
    dual_source: 0.75
    triple_source: 0.85
    quad_plus_source: 0.95
    
    temporal_consistency_bonus: 0.10   # +10% if signals consistent over 30 days
    cross_platform_bonus: 0.15        # +15% if signals across 3+ platforms

# Cultural Intelligence Scoring
cultural_intelligence:
  communication_style_markers:
    western_direct:
      keywords: ["直接反馈", "straightforward", "transparent", "candid"]
      score_range: [0.7, 1.0]
      
    chinese_relationship:
      keywords: ["合作伙伴", "长期关系", "互惠", "guanxi", "partnership"]
      score_range: [0.6, 0.9]
      
    hybrid_approach:
      keywords: ["cross-cultural", "international", "bridge", "dual background"]
      score_range: [0.8, 1.0]

  cross_border_readiness_indicators:
    international_team: 0.30
    multi_language_content: 0.25  
    regulatory_awareness: 0.25
    market_expansion_signals: 0.20

# Partnership Compatibility Framework
partnership_compatibility:
  revenue_model_alignment:
    recurring_revenue_bonus: 0.25
    transparency_bonus: 0.20
    growth_focused_bonus: 0.15
    scalability_bonus: 0.10

  governance_compatibility:
    collaborative_decision_indicators: 0.30
    stakeholder_consideration: 0.25
    flexibility_signals: 0.25
    communication_frequency: 0.20

  growth_timeline_scoring:
    twelve_eighteen_month_horizon:
      optimal_range: [12, 18]  # months
      score_multiplier: 1.0
      
    sustainable_pace_indicators:
      controlled_growth_signals: 0.40
      milestone_oriented_approach: 0.35
      realistic_expectation_signals: 0.25

# Quality Control Parameters
quality_control:
  minimum_signal_quality: 0.60
  maximum_processing_age_hours: 72
  entity_resolution_threshold: 0.85
  evidence_chain_max_depth: 5
  required_correlation_confidence: 0.75

# System Performance Targets
performance_targets:
  processing_latency_max_seconds: 300
  alert_generation_max_minutes: 60
  daily_signal_capacity: 10000
  concurrent_company_analysis: 100
  query_response_max_seconds: 5
  system_uptime_target: 0.99