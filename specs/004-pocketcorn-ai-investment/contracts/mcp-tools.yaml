# Pocketcorn MCP Tools Configuration
# Version: v1.0.0
# Last Updated: 2025-09-11

# Primary MCP Tool Integrations for Enterprise Discovery

mcp_tools:
  # Core Data Collection Tools
  rube_mcp:
    name: "Rube Workflow Orchestration MCP"
    description: "Multi-platform workflow orchestration with 500+ platform integrations"
    capabilities:
      - chinese_platform_integration
      - financial_system_support
      - workflow_automation
      - rate_limiting_management
    endpoints:
      - "/workflow/create"
      - "/workflow/execute" 
      - "/workflow/status"
      - "/platforms/list"
      - "/platforms/{platform}/limits"
    chinese_platforms:
      - zhihu
      - xiaohongshu
      - v2ex
      - weibo
      - boss_zhipin
      - lagou
      - liepin
      - maimai
    international_platforms:
      - linkedin
      - github
      - twitter
      - producthunt
      - app_store
      - google_play
    rate_limits:
      zhihu: 25  # requests per minute
      xiaohongshu: 20
      v2ex: 30
      weibo: 15
      boss_zhipin: 40
      linkedin: 20
      github: 60
      twitter: 15
      producthunt: 10

  playwright_mcp:
    name: "Playwright Browser Automation MCP"
    description: "Advanced browser automation with anti-detection capabilities"
    capabilities:
      - dynamic_content_extraction
      - anti_detection_browsing
      - cookie_session_management
      - proxy_rotation
      - human_behavioral_simulation
    endpoints:
      - "/browser/create"
      - "/browser/navigate"
      - "/browser/extract"
      - "/browser/screenshot"
      - "/browser/close"
    anti_detection_features:
      - user_agent_rotation
      - viewport_randomization
      - request_timing_humanization
      - cookie_persistence
      - proxy_pool_management
    supported_platforms:
      - spa_applications
      - dynamic_job_boards
      - social_media_feeds
      - protected_content_areas

  tavily_search_mcp:
    name: "Tavily Intelligent Search MCP"
    description: "Real-time search and intelligence gathering with context awareness"
    capabilities:
      - real_time_search
      - context_aware_queries
      - multi_language_support
      - trend_analysis
      - semantic_search
    endpoints:
      - "/search/query"
      - "/search/trends"
      - "/search/company"
      - "/search/founder"
      - "/search/news"
    search_domains:
      - company_information
      - founder_backgrounds
      - product_launches
      - funding_announcements
      - industry_trends
      - competitive_intelligence

# Local Integration Adapters (Bridge to Existing Scraperr)
local_adapters:
  scraperr_collectors:
    description: "Bridge existing Scraperr collectors as MCP-compatible services"
    collectors:
      - zhihu_public
      - v2ex_public
      - linkedin_public
      - twitter_public
      - github_public
      - github_releases
      - producthunt_public
      - youtube_public
    adapter_interface:
      normalize_signals: true
      correlation_support: true
      rate_limit_compliance: true
      error_handling: "graceful_degradation"

# Data Processing Tools
data_processing_tools:
  entity_resolution_mcp:
    name: "Cross-Platform Entity Resolution"
    description: "Intelligent entity matching across platforms with cultural context"
    capabilities:
      - chinese_name_normalization
      - cross_platform_correlation
      - confidence_scoring
      - deduplication
    algorithms:
      - fuzzy_string_matching
      - semantic_similarity
      - social_graph_analysis
      - temporal_correlation
    confidence_thresholds:
      high_confidence: 0.90
      medium_confidence: 0.75
      low_confidence: 0.60

  cultural_intelligence_mcp:
    name: "Cultural Intelligence Processor"
    description: "East-West business culture analysis and compatibility assessment"
    capabilities:
      - communication_style_analysis
      - business_approach_classification
      - cross_border_readiness_assessment
      - partnership_compatibility_scoring
    cultural_markers:
      western_indicators:
        - direct_communication
        - individual_decision_making
        - transparency_emphasis
        - process_orientation
      chinese_indicators:
        - relationship_building
        - consensus_seeking
        - face_saving_considerations
        - long_term_orientation
      hybrid_indicators:
        - bilingual_communication
        - cross_cultural_team
        - international_experience
        - dual_market_focus

  mrr_inference_mcp:
    name: "MRR Inference Engine"
    description: "Multi-signal revenue estimation with confidence intervals"
    capabilities:
      - hiring_velocity_analysis
      - pricing_model_detection
      - customer_volume_estimation
      - infrastructure_cost_correlation
    inference_algorithms:
      - regression_models
      - ensemble_methods
      - bayesian_estimation
      - confidence_interval_calculation
    signal_weights:
      hiring_signals: 0.30
      pricing_signals: 0.25
      customer_signals: 0.20
      infrastructure_signals: 0.15
      media_signals: 0.10

# Alert and Notification Tools
alerting_tools:
  alert_classification_mcp:
    name: "Investment Alert Classification"
    description: "Intelligent alert prioritization and delivery management"
    capabilities:
      - tier_classification
      - deduplication
      - cooldown_management
      - evidence_compilation
    classification_rules:
      tier_a:
        confidence_min: 0.90
        sources_min: 3
        score_min: 0.75
        max_daily: 2
      tier_b:
        confidence_min: 0.80
        sources_min: 2
        score_min: 0.65
        max_daily: 5
      tier_c:
        confidence_min: 0.60
        sources_min: 1
        score_min: 0.50
        max_daily: 10

  evidence_chain_mcp:
    name: "Evidence Chain Builder"
    description: "Comprehensive evidence tracking and audit trail generation"
    capabilities:
      - source_link_preservation
      - weight_calculation
      - confidence_scoring
      - temporal_tracking
    evidence_types:
      - direct_revenue_mentions
      - hiring_announcements
      - product_updates
      - customer_testimonials
      - partnership_announcements
      - media_coverage

# Integration Orchestration
orchestration_config:
  async_coordination:
    max_concurrent_workflows: 10
    workflow_timeout_minutes: 30
    retry_configuration:
      max_retries: 3
      backoff_strategy: "exponential"
      base_delay_seconds: 30
      max_delay_seconds: 1800

  degradation_strategies:
    rate_limit_response:
      - reduce_request_frequency
      - switch_to_backup_endpoints
      - delay_non_urgent_requests
      - activate_proxy_rotation
    
    access_denied_response:
      - switch_to_alternative_platforms
      - activate_playwright_browser_mode
      - delay_until_off_peak_hours
      - notify_manual_intervention_required

    detection_suspected_response:
      - immediate_session_termination
      - cool_down_period_activation
      - switch_to_different_user_agents
      - activate_human_behavior_simulation

  off_peak_schedules:
    asia_pacific:
      optimal_hours: "00:00-06:00"  # Asia/Shanghai timezone
      reduced_activity_hours: "09:00-18:00"
    
    north_america:
      optimal_hours: "23:00-06:00"  # America/Los_Angeles timezone
      reduced_activity_hours: "09:00-17:00"

    europe:
      optimal_hours: "01:00-07:00"  # Europe/London timezone
      reduced_activity_hours: "09:00-17:00"

# Performance Monitoring
monitoring_config:
  health_checks:
    mcp_server_availability: "every_5_minutes"
    platform_accessibility: "every_15_minutes"
    rate_limit_compliance: "continuous"
    data_quality_validation: "every_1_hour"

  performance_metrics:
    signal_collection_rate: "signals_per_hour"
    processing_latency: "seconds_per_signal"
    entity_resolution_accuracy: "percentage"
    alert_generation_speed: "minutes_to_alert"

  alerting_thresholds:
    collection_rate_drop: 20  # percent decrease
    processing_latency_spike: 300  # seconds
    accuracy_drop: 5  # percent decrease
    alert_delay: 90  # minutes

# Security and Compliance
security_config:
  data_handling:
    public_data_only: true
    pii_detection_enabled: true
    data_retention_days: 90
    audit_trail_enabled: true

  platform_compliance:
    robots_txt_respect: true
    rate_limit_compliance: true
    terms_of_service_adherence: true
    user_agent_identification: true

  access_control:
    api_key_rotation_days: 30
    session_timeout_minutes: 60
    ip_whitelist_enabled: false
    geographic_restrictions: []

# Error Handling and Logging
error_handling:
  logging_level: "INFO"
  structured_logging: true
  log_retention_days: 30
  error_categorization:
    - platform_access_errors
    - rate_limiting_errors
    - data_parsing_errors
    - network_connectivity_errors
    - authentication_errors

  recovery_procedures:
    automatic_retry: true
    graceful_degradation: true
    failover_mechanisms: true
    manual_intervention_triggers: true